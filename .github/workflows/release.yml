name: Release & Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack & publish (e.g. 6.0.0)'
        required: true
        type: string

permissions:
  contents: write    # To create GitHub Releases and upload release assets
  id-token: write    # Required for NuGet Trusted Publishing via OIDC (no API keys)

jobs:
  build-and-publish:
    name: Build, Test & Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore MorseSharp/MorseSharp.csproj
          dotnet restore MorseTest/MorseTest.csproj

      - name: Run Test Suite (100% Pass Gate)
        run: dotnet test MorseTest/MorseTest.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Determine Version
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          else
            TAG_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "PKG_VERSION=$TAG_VER" >> $GITHUB_OUTPUT
          echo "Packaging version: $TAG_VER"

      - name: Pack NuGet Package
        run: >
          dotnet pack MorseSharp/MorseSharp.csproj
          --configuration Release
          -p:Version=${{ steps.version_step.outputs.PKG_VERSION }}
          --output dist/

      - name: NuGet Login (OIDC Trusted Publishing -> Temp API Key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'p0laris' }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push dist/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Generate Release Notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: MorseSharp v${{ steps.version_step.outputs.PKG_VERSION }}
          body_path: RELEASE_NOTES.md
          files: dist/*
